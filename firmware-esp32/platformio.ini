; =============================================================================
;  PlatformIO — firmware del cartel
; =============================================================================
;  Entornos:
;    esp32dev : el cartel real (necesita cartel/secrets.h)
;    wokwi    : misma placa pero en MODO SIMULACION (sin WiFi), para Wokwi
;
;  Compilar:   pio run -e esp32dev
;  Subir:      pio run -e esp32dev -t upload
;  Monitor:    pio device monitor
; =============================================================================
[platformio]
; Los fuentes están en "cartel/" (con cartel.ino dentro) para que el MISMO
; código se abra también con el Arduino IDE y se pegue en el editor de Wokwi.
src_dir = cartel
default_envs = esp32dev

[env]
platform = espressif32@6.9.0     ; versión fija: compilaciones reproducibles
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

[env:esp32dev]
; (sin opciones extra)

[env:wokwi]
build_flags = -DSIMULACION=1
