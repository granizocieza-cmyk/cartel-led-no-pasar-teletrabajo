; =============================================================================
;  config.ini — Configuración de cartel-agent
; =============================================================================
;  Copia este archivo como  config.ini  junto a cartel-agent.exe y edítalo con
;  el Bloc de notas. (instalar-arranque.ps1 lo hace por ti.)
;  Las líneas que empiezan por ; son comentarios.
;  Tras cambiar algo, reinicia el agente:  cartel-agent.exe --parar  y vuelve a abrirlo.
; =============================================================================

[cartel]
; Dónde está el ESP32. "cartel.local" funciona en Windows 10/11 sin configurar nada.
; Si no resuelve (algunos routers/redes de empresa bloquean mDNS), pon la IP
; que el cartel enseña al arrancar, por ejemplo 192.168.1.50.
host = cartel.local

; (Opcional) IP a probar si el nombre de arriba falla. Útil: host = cartel.local
; y host_respaldo = 192.168.1.50 (reserva esa IP fija en tu router).
host_respaldo =

puerto = 80

; (Opcional) Debe coincidir con TOKEN_CARTEL en secrets.h del firmware. Solo letras y números.
token =

[tiempos]
; Cada cuántos milisegundos se mira el micrófono. 1000 = una vez por segundo.
sondeo_ms = 1000

; Cada cuántos segundos se repite el estado aunque no cambie ("latido").
; El cartel pasa a neutro (?) si pasan 45 s sin recibir nada, así que mantén esto por debajo.
latido_s = 15

; Antirrebote: segundos con el micro libre antes de mostrar PASAR.
; Evita que el cartel parpadee si el micro se corta un momento.
retardo_libre_s = 5

; Tras un fallo de red, cada cuántos segundos reintentar.
reintento_s = 5

; Tiempo máximo de espera de cada petición HTTP.
timeout_http_ms = 2000
